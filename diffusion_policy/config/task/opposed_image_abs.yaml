# Shared per-arm config for TwoArmOpposedEnv tasks (one arm-agnostic policy). Keys are generic; OpposedArmRunner maps
# them to the active arm (arm_key: 'robot_eef_base_pos' -> 'robot{i}_eef_base_pos'). Proprio/actions are in the active
# robot's base frame. Task configs set name, task_name, dataset_path, max_steps.
name: ???

shape_meta: &shape_meta
  obs:
    shouldercamera_image:
      shape: [3, 84, 84]
      type: rgb
    robot_eye_in_hand_image:
      shape: [3, 84, 84]
      type: rgb
    robot_eef_base_pos:
      shape: [3]
    robot_eef_base_quat:
      shape: [4]
    robot_gripper_qpos:
      shape: [2]
  action:
    shape: [10]

task_name: ???
dataset_path: ???
max_steps: ???
abs_action: &abs_action True

env_runner:
  _target_: diffusion_policy.env_runner.opposed_arm_runner.OpposedArmRunner
  dataset_path: ${task.dataset_path}
  shape_meta: *shape_meta
  n_train: 4
  n_train_vis: 1
  train_start_idx: 0
  n_test: 24     # per arm
  n_test_vis: 3
  test_start_seed: 100000
  max_steps: ${task.max_steps}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  render_obs_key: 'shouldercamera_image'
  fps: 10
  crf: 22
  past_action: ${past_action_visible}
  abs_action: *abs_action
  tqdm_interval_sec: 1.0
  n_envs: 14     # per arm -> 28 env processes total

dataset:
  _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  abs_action: *abs_action
  rotation_rep: 'rotation_6d'
  use_legacy_normalizer: False
  use_cache: True
  seed: 42
  val_ratio: 0.02
